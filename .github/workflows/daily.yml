name: Daily job search

on:
  schedule:
    # GitHub interprète les crons en UTC. 7h17 à Paris = 5h17 UTC en heure d'été (UTC+2)
    # ou 6h17 UTC en heure d'hiver (UTC+1). On planifie les deux ; le job "gate" garde
    # celui qui correspond à la saison. Minute 17 : on évite le pic de charge du début d'heure.
    - cron: '17 5 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main

concurrency:
  group: job-agent      # jamais deux exécutions en parallèle
  cancel-in-progress: false

permissions:
  contents: read        # principe du moindre privilège : le job ne fait que lire le dépôt

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # On raisonne sur le cron qui a déclenché le run, pas sur l'heure courante :
          # un run parti en retard est donc conservé.
          OFFSET=$(TZ=Europe/Paris date +%z)   # +0200 en été, +0100 en hiver
          if [ "$EVENT" = "workflow_dispatch" ] \
            || { [ "$CRON" = "17 5 * * *" ] && [ "$OFFSET" = "+0200" ]; } \
            || { [ "$CRON" = "17 6 * * *" ] && [ "$OFFSET" = "+0100" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cron '$CRON' ignoré : Paris est en UTC$OFFSET, c'est l'autre déclenchement qui tombe à 7h17"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  search:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run agent
        run: npm start
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}