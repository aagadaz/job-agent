name: Daily job search
# Titre de chaque exécution. Pour un lancement depuis l'interface, il contient l'id de la ligne
# "runs" : l'interface retrouve ainsi SON run via l'API GitHub et peut en lire l'issue.
run-name: ${{ inputs.run_id && format('Recherche manuelle {0}', inputs.run_id) || 'Daily job search' }}

on:
  schedule:
    # GitHub interprète les crons en UTC. 7h17 à Paris = 5h17 UTC en heure d'été (UTC+2)
    # ou 6h17 UTC en heure d'hiver (UTC+1). On planifie les deux ; le job "gate" garde
    # celui qui correspond à la saison. Minute 17 : on évite le pic de charge du début d'heure.
    - cron: '17 5 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch: # lancement à la main : bouton "Run workflow" de GitHub, ou bouton de l'interface
    inputs:
      user_id:
        description: "UUID de l'utilisateur à traiter (vide = tous)"
        required: false
        default: ''
      run_id:
        description: "UUID de la ligne runs créée par l'interface (facultatif)"
        required: false
        default: ''

concurrency:
  # Une file par utilisateur pour les lancements manuels, une file "all" pour le cron :
  # GitHub ne garde qu'UNE exécution en attente par groupe, un groupe unique ferait
  # s'annuler les clics de deux utilisateurs différents.
  group: job-agent-${{ inputs.user_id || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read        # principe du moindre privilège : le job ne fait que lire le dépôt

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          # On raisonne sur le cron qui a déclenché le run, pas sur l'heure courante :
          # un run parti en retard est donc conservé.
          OFFSET=$(TZ=Europe/Paris date +%z)   # +0200 en été, +0100 en hiver
          if [ "$EVENT" = "workflow_dispatch" ] \
            || { [ "$CRON" = "17 5 * * *" ] && [ "$OFFSET" = "+0200" ]; } \
            || { [ "$CRON" = "17 6 * * *" ] && [ "$OFFSET" = "+0100" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cron '$CRON' ignoré : Paris est en UTC$OFFSET, c'est l'autre déclenchement qui tombe à 7h17"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  search:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run agent
        run: npm run worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Passés par variables d'environnement, JAMAIS interpolés dans un script "run:"
          # (sinon une valeur malveillante deviendrait une commande shell : injection)
          ONLY_USER_ID: ${{ inputs.user_id }}
          RUN_ID: ${{ inputs.run_id }}