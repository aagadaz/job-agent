name: job-agent

services:
  # ─── Le site ───
  app:
    build:
      context: .
      target: app
    image: job-agent-app
    restart: unless-stopped
    env_file: .env.docker
    environment:
      AUTH_TRUST_HOST: "true"

  # ─── Caddy : reçoit le trafic Internet et gère le HTTPS ───
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config: